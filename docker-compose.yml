# FraudStream — Docker Compose stack.
#
#   Infrastructure only (host-run apps, Phase 8/9 style):
#     docker compose --env-file .env up -d kafka postgres redis kafka-init
#   FULL DISTRIBUTED profile, everything in containers (Phase 10):
#     docker compose --env-file .env --profile distributed up -d --build
#       -> dashboard http://127.0.0.1:${FRONTEND_HOST_PORT:-8080}
#   Containerised LOCAL profile (in-process pipeline + SQLite; no Kafka/Spark/Redis/PostgreSQL):
#     docker compose --env-file .env --profile local up -d --build api-local frontend-local
#       -> dashboard http://127.0.0.1:${FRONTEND_LOCAL_HOST_PORT:-8081}
#   Optional python-kafka FALLBACK processor (non-Spark; refuses to run while Spark reports):
#     docker compose --env-file .env --profile python-processor up -d python-processor
#
# Host ports (127.0.0.1 only): Kafka 9092, PostgreSQL 5433, Redis 6380, Spark UI 4040,
# dashboard 8080 (distributed) / 8081 (local). The API is NOT published on the host: it is
# reached through the dashboard's nginx at /api. Containers talk on the private network.
# Spark runs in LOCAL MODE (one JVM, local[N] threads) inside ONE container - not a cluster.

name: fraudstream

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Shared by every application container of the DISTRIBUTED profile. Secrets come from .env.
x-app-env: &app-env
  FRAUDSTREAM_ENV: ${FRAUDSTREAM_ENV:-development}
  FRAUDSTREAM_PROFILE: distributed
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fraudstream}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fraudstream}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  FRAUDSTREAM_TOPIC_PREFIX: ${FRAUDSTREAM_TOPIC_PREFIX:-}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-1200}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  CORS_ORIGINS: http://127.0.0.1:${FRONTEND_HOST_PORT:-8080},http://localhost:${FRONTEND_HOST_PORT:-8080}
  FRAUDSTREAM_ARTIFACTS_DIR: /app/ml/artifacts
  RUNTIME_CONFIG_DIR: /state

x-app-build: &app-build
  context: .
  dockerfile: infrastructure/docker/app.Dockerfile

x-infra-ready: &infra-ready
  kafka: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }

x-api-health: &api-health
  test: ["CMD", "python", "/app/infrastructure/docker/healthcheck.py", "http", "http://127.0.0.1:8000/api/v1/health"]
  interval: 10s
  timeout: 6s
  retries: 6
  start_period: 40s

services:
  # ------------------------------------------------------------------ infrastructure (Phase 8, unchanged)
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      # 127.0.0.1 (not "localhost"): on Windows "localhost" resolves to ::1 first and clients stall ~2 s per connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-fsk1-lOcAlClusTer0001A}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1      # fsync each message: durability over throughput (single broker)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [fraudstream]
    logging: *logging
    mem_limit: 1g

  kafka-init:
    # One-shot: creates all FraudStream topics with the configured partitions/retention.
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
      TOPIC_PREFIX: ${FRAUDSTREAM_TOPIC_PREFIX:-}
    volumes:
      - ./infrastructure/kafka/create_topics.sh:/scripts/create_topics.sh:ro
    networks: [fraudstream]
    restart: "no"
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudstream}
      POSTGRES_USER: ${POSTGRES_USER:-fraudstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fraudstream]
    logging: *logging
    mem_limit: 512m
    # Phase 12: concurrent analytics requests on ~190k transactions failed with HTTP 500 ("could not resize shared
    # memory segment ... No space left on device"): parallel hash joins build their SHARED hash table in /dev/shm
    # (Docker default 64 MB). Measured fix (docs/phase12/RELIABILITY_REPORT.md): /dev/shm 256 MB and no parallel
    # hash (workers build private hash tables; parallel scans/aggregates stay). 1 GB of memory did not fix it alone.
    shm_size: 256m
    command: ["postgres", "-c", "enable_parallel_hash=off"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [fraudstream]
    logging: *logging
    mem_limit: 256m

  # ------------------------------------------------------------------ stream processing (Phase 9)
  spark:
    # Spark Structured Streaming job, LOCAL MODE (one JVM, local[N] threads) inside this container.
    # Part of the "distributed" profile; the "spark" profile is kept for the Phase 9 commands.
    build:
      context: .
      dockerfile: infrastructure/spark/Dockerfile
    image: fraudstream-spark:local
    profiles: ["spark", "distributed"]
    restart: unless-stopped   # a failed query makes the job exit non-zero -> restarted from its checkpoint
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FRAUDSTREAM_TOPIC_PREFIX: ${FRAUDSTREAM_TOPIC_PREFIX:-}
      FRAUDSTREAM_ARTIFACTS_DIR: /app/ml/artifacts
      CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR:-/checkpoints/v2}   # new path when partitioning changes; old dirs are kept
      SPARK_MASTER: ${SPARK_MASTER:-local[8]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      WATERMARK_DELAY: ${SPARK_WATERMARK_DELAY:-10 minutes}
      TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-2 seconds}
      STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}   # only applies to a NEW checkpoint
      PROGRESS_FILE: /tmp/spark-progress.json                  # local heartbeat for the health check
    volumes:
      # source + model artifacts, READ-ONLY - only the directories the job uses. (Phases 9-11 mounted the whole
      # repository, which also exposed .env - every live secret - inside this container; Phase 12 security fix.)
      - ./backend:/app/backend:ro
      - ./ml:/app/ml:ro
      - ./streaming:/app/streaming:ro
      - ./simulator:/app/simulator:ro
      - ./infrastructure/docker/healthcheck.py:/app/infrastructure/docker/healthcheck.py:ro
      - spark-checkpoints:/checkpoints   # offsets, commits and state store (restart recovery)
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    healthcheck:
      # healthy = progress written within 45 s AND every streaming query active without an exception
      test: ["CMD", "python", "/app/infrastructure/docker/healthcheck.py", "spark", "/tmp/spark-progress.json", "45"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 120s
    networks: [fraudstream]
    logging: *logging
    mem_limit: 3g
    stop_grace_period: 60s             # let queries finish the current batch and stop cleanly

  # ------------------------------------------------------------------ application containers (Phase 10)
  app-init:
    # One-shot: Alembic migrations + login accounts from .env (idempotent; never resets passwords).
    build: *app-build
    image: fraudstream-app:local
    profiles: ["distributed"]
    command: ["/app/infrastructure/docker/app-init.sh"]
    environment:
      <<: *app-env
      FRAUDSTREAM_ADMIN_USERNAME: ${FRAUDSTREAM_ADMIN_USERNAME:-admin}
      FRAUDSTREAM_ADMIN_PASSWORD: ${FRAUDSTREAM_ADMIN_PASSWORD:-}
      FRAUDSTREAM_ANALYST_USERNAME: ${FRAUDSTREAM_ANALYST_USERNAME:-analyst}
      FRAUDSTREAM_ANALYST_PASSWORD: ${FRAUDSTREAM_ANALYST_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [fraudstream]
    logging: *logging

  api:
    build: *app-build
    image: fraudstream-app:local
    profiles: ["distributed"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      <<: *infra-ready
      app-init: { condition: service_completed_successfully }
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:${ARTIFACTS_MOUNT_MODE:-ro}
      - ./data/synthetic:/data/synthetic:ro          # training dataset (read-only)
      - app-data:/data/uploads                         # dataset uploads
      - app-state:/state                               # derived runtime_config.json
    healthcheck: *api-health
    networks: [fraudstream]
    logging: *logging
    mem_limit: 1536m
    stop_grace_period: 20s

  persistence-consumer:
    build: *app-build
    image: fraudstream-app:local
    profiles: ["distributed"]
    restart: unless-stopped
    command: ["python", "-m", "app.streaming.persistence_consumer"]
    environment:
      <<: *app-env
      CONSUMER_HEALTH_FILE: /tmp/consumer-heartbeat.json
    depends_on:
      <<: *infra-ready
      app-init: { condition: service_completed_successfully }
    healthcheck:
      # the consume loop writes this every ~5 s, also while it waits out a database outage
      test: ["CMD", "python", "/app/infrastructure/docker/healthcheck.py", "file", "/tmp/consumer-heartbeat.json", "30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [fraudstream]
    logging: *logging
    mem_limit: 512m
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
    image: fraudstream-frontend:local
    profiles: ["distributed"]
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    networks: [fraudstream]
    logging: *logging
    mem_limit: 128m

  python-processor:
    # Development/FALLBACK stream processor (non-Spark). Opt-in only; it refuses to start while a
    # live Spark job is reporting (and Spark refuses while this one is) - no silent switching.
    build: *app-build
    image: fraudstream-app:local
    profiles: ["python-processor"]
    restart: unless-stopped
    command: ["python", "-m", "app.streaming.processor"]
    environment: *app-env
    depends_on: *infra-ready
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    networks: [fraudstream]
    logging: *logging
    mem_limit: 1g

  # ------------------------------------------------------------------ containerised LOCAL profile
  api-local:
    # LOCAL DEVELOPMENT profile: in-process pipeline + SQLite. Uses no Kafka/Redis/Spark/PostgreSQL.
    build: *app-build
    image: fraudstream-app:local
    profiles: ["local"]
    restart: unless-stopped
    environment:
      FRAUDSTREAM_ENV: ${FRAUDSTREAM_ENV:-development}
      FRAUDSTREAM_PROFILE: local
      DATABASE_URL: sqlite:////data/db/fraudstream-local.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRAUDSTREAM_ARTIFACTS_DIR: /app/ml/artifacts
      RUNTIME_CONFIG_DIR: /state
      CORS_ORIGINS: http://127.0.0.1:${FRONTEND_LOCAL_HOST_PORT:-8081}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-1200}
      FRAUDSTREAM_ADMIN_USERNAME: ${FRAUDSTREAM_ADMIN_USERNAME:-admin}
      FRAUDSTREAM_ADMIN_PASSWORD: ${FRAUDSTREAM_ADMIN_PASSWORD:-}
      FRAUDSTREAM_ANALYST_USERNAME: ${FRAUDSTREAM_ANALYST_USERNAME:-analyst}
      FRAUDSTREAM_ANALYST_PASSWORD: ${FRAUDSTREAM_ANALYST_PASSWORD:-}
    # SQLite lives in this one container, so migrations/accounts run here before the API starts.
    command: ["sh", "-c", "/app/infrastructure/docker/app-init.sh && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:${ARTIFACTS_MOUNT_MODE:-ro}
      - ./data/synthetic:/data/synthetic:ro
      - local-data:/data/db
      - local-state:/state
    healthcheck: *api-health
    networks: [fraudstream]
    logging: *logging
    mem_limit: 1536m

  frontend-local:
    build:
      context: ./frontend
    image: fraudstream-frontend:local
    profiles: ["local"]
    restart: unless-stopped
    environment:
      API_UPSTREAM: api-local:8000
    depends_on:
      api-local: { condition: service_healthy }
    ports:
      - "127.0.0.1:${FRONTEND_LOCAL_HOST_PORT:-8081}:8080"
    networks: [fraudstream]
    logging: *logging
    mem_limit: 128m

networks:
  fraudstream:
    name: fraudstream

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  spark-checkpoints:
  app-data:
  app-state:
  local-data:
  local-state:
